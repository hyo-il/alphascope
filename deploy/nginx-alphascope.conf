# AlphaScope — 오라클 nginx 설정 (v2.61.1 https · v2.61.2 주소 = https://161.33.153.189:8080)
# 화면은 빌드한 완성본(/var/www/alphascope)을 nginx 가 직접 보내고, /api/ 만 Express(4000)로 넘긴다.
# 이 파일은 deploy/apply-nginx.sh 가 /etc/nginx/sites-available/alphascope 로 복사한다(처음 https 로 바꿀 때는 deploy/setup-https.sh 가 그 스크립트를 부른다).
# 주소: https://161.33.153.189:8080 하나. 같은 8080 에 평문 http 로 들어오면 같은 문의 https 로 넘긴다(error_page 497 — 아래).
# 문 번호 없는 주소(443)는 어느 블록도 듣지 않는다 — 접속 거절(사용자 결정 2026-11-06).
# 80번 문은 인증서 확인(HTTP-01)용 — deploy/nginx-alphascope-acme.conf 따로(sites-available/alphascope-acme · 확인 경로 밖은 끊음).
# 인증서: Let's Encrypt IP 인증서(shortlived — 약 6일 · 대상 = IP 라 문 번호와 상관없음) · Certbot 이 /etc/letsencrypt/live/161.33.153.189/ 에 두고 약 3일마다 갱신 → nginx reload.
# ⚠️ listen 의 문 번호는 deploy.sh · apply-nginx.sh · setup-https.sh · switch-to-static.sh · upgrade-node24.sh · check-https.sh 의
#    PUBLIC_PORT(8080) 와 같아야 한다(npm run deploy:test 가 확인).
# ⚠️ HSTS(Strict-Transport-Security)는 넣지 않는다 — 6일 인증서 갱신이 한 번 늦어 만료되면, HSTS 가 있는 브라우저는
#    「그래도 계속」 도 막아 앱을 아예 열 수 없다. 없으면 경고를 넘겨 들어가 고칠 수 있다.

server {
    listen 8080 ssl;
    server_name 161.33.153.189;

    # 같은 문(8080)에 평문 http 로 온 요청 → 같은 경로(물음표 뒤까지)로 https 301.
    # 497 = 「https 문에 평문 http 요청」(nginx 공식 https://nginx.org/en/docs/http/ngx_http_ssl_module.html 「Error Processing」 —
    # 넘길 때 $request_uri 를 쓸 수 있다) · 주소로 넘기기 · =301(https://nginx.org/en/docs/http/ngx_http_core_module.html#error_page).
    # 아래 location 들은 error_page 를 따로 두지 않아 이 줄을 그대로 물려받는다(같은 문서 — 그 단계에 error_page 가 없을 때만 물려받음).
    error_page 497 =301 https://161.33.153.189:8080$request_uri;

    ssl_certificate     /etc/letsencrypt/live/161.33.153.189/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/161.33.153.189/privkey.pem;
    # TLS — Mozilla 권장 intermediate(https://ssl-config.mozilla.org/guidelines/latest.json · 지침 6.0)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # 지침의 X25519MLKEM768 은 OpenSSL 3.5 이상이 있어야 해서 뺐다(옛 OpenSSL 이면 nginx -t 실패)
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    # OCSP 스테이플링은 하지 않는다 — shortlived 인증서에는 폐기 정보가 없다(https://letsencrypt.org/docs/profiles/)

    # 완성본 위치 — 홈 폴더(/home/ubuntu/...)는 nginx(www-data)가 못 읽어 403 이 날 수 있어 여기에 복사해 둔다
    root /var/www/alphascope;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 서버
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # $http_host = 브라우저가 보낸 Host 그대로(문 번호가 있으면 포함). $host 는 문 번호를 빼서, 서버의 Origin ↔ Host 비교
        # (server/authGuard.ts isOwnOrigin)가 어긋나 로그인 · 저장이 403 이 된다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # https 로 들어왔다고 알린다 — 서버(trust proxy = loopback)가 req.secure 로 읽어 로그인 쿠키에 Secure 를 붙인다(server/auth.ts)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # 급등 탐지 등 긴 요청 대비
    }

    # 빌드 파일(js·css·글꼴) — 이름에 해시가 있어 오래 저장해도 된다. 없는 파일은 404.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 첫 화면 — 배포 뒤 새로고침 한 번으로 새 화면이 보이도록 저장하지 않는다.
    # "/" 요청도 index 지시어로 여기에 들어온다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 그 밖 — 있는 파일(파비콘 등)은 그대로, 없으면 첫 화면.
    # 화면 주소는 해시(#/page/tab)라 서버는 index.html 하나만 알면 된다.
    location / {
        try_files $uri /index.html;
    }
}
