# AlphaScope — 오라클 nginx 설정 (v2.36.1)
# 화면은 빌드한 완성본(/var/www/alphascope)을 nginx 가 직접 보내고, /api/ 만 Express(4000)로 넘긴다.
# 예전에는 location / 가 Vite 개발 서버(5173)로 넘겼다 — 개발 서버는 인터넷에 여는 용도가 아니다
# (깨진 주소 요청 하나가 열려 있는 모든 화면에 「URI malformed」 오류 창을 띄웠다).
# 이 파일은 deploy/switch-to-static.sh 가 /etc/nginx/sites-available/alphascope 로 복사한다.

server {
    listen 80;
    server_name 161.33.153.189;

    # 완성본 위치 — 홈 폴더(/home/ubuntu/...)는 nginx(www-data)가 못 읽어 403 이 날 수 있어 여기에 복사해 둔다
    root /var/www/alphascope;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 서버 — 예전 설정과 같다(바꾸지 않는다)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;  # 급등 탐지 등 긴 요청 대비
    }

    # 빌드 파일(js·css·글꼴) — 이름에 해시가 있어 오래 저장해도 된다. 없는 파일은 404.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 첫 화면 — 배포 뒤 새로고침 한 번으로 새 화면이 보이도록 저장하지 않는다.
    # "/" 요청도 index 지시어로 여기에 들어온다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 그 밖 — 있는 파일(파비콘 등)은 그대로, 없으면 첫 화면.
    # 화면 주소는 해시(#/page/tab)라 서버는 index.html 하나만 알면 된다.
    location / {
        try_files $uri /index.html;
    }
}
