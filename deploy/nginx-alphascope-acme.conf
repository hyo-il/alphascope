# AlphaScope — 80번 문: Let's Encrypt 인증서 확인(HTTP-01)만 (v2.61.1 · v2.61.2 확인 경로 밖은 끊음)
# deploy/setup-https.sh 가 /etc/nginx/sites-available/alphascope-acme 로 복사하고 sites-enabled 에 링크한다(바뀌면 deploy/apply-nginx.sh 가 넣는다).
# IP 인증서의 확인은 80번 문(HTTP-01)으로 한다 — Certbot 은 TLS-ALPN-01(443)을 하지 않는다(deploy/README.md 「HTTPS 조사」).
# 인증서는 약 3일마다 갱신되므로 80번 문은 늘 열어 둔다. 확인 경로 말고는 아무것도 보여 주지 않는다(사용자 결정 2026-11-06 — 문 번호 없는 주소는 닫음).
# 확인 파일 폴더는 화면 폴더(/var/www/alphascope)와 따로 둔다 — 배포의 rsync --delete 가 지우지 않게.

server {
    listen 80;
    server_name 161.33.153.189;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 그 밖 — 응답 머리 없이 연결을 끊는다. 444 = nginx 비표준 코드
    # 「The non-standard code 444 closes a connection without sending a response header」(https://nginx.org/en/docs/http/ngx_http_rewrite_module.html#return)
    location / {
        return 444;
    }
}
