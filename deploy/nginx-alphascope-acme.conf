# AlphaScope — 80번 문: Let's Encrypt 인증서 확인(HTTP-01)만 (v2.61.1)
# deploy/setup-https.sh 가 /etc/nginx/sites-available/alphascope-acme 로 복사하고 sites-enabled 에 링크한다.
# IP 인증서의 확인은 80번 문(HTTP-01)으로 한다 — Certbot 은 TLS-ALPN-01(443)을 하지 않는다(deploy/README.md 「HTTPS 조사」).
# 인증서는 약 3일마다 갱신되므로 80번 문은 늘 열어 둔다. 확인 경로 말고는 https 로 넘긴다
# (Let's Encrypt 는 넘김을 80 · 443 으로만 따라가므로 확인 경로는 넘기지 않고 여기서 바로 보낸다).
# 확인 파일 폴더는 화면 폴더(/var/www/alphascope)와 따로 둔다 — 배포의 rsync --delete 가 지우지 않게.

server {
    listen 80;
    server_name 161.33.153.189;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://161.33.153.189$request_uri;
    }
}
