<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AlphaScope">
  <!--
    AlphaScope 아이콘 — 렌즈(원) 안의 오르는 캔들 둘.
    "Scope(살펴봄) + 차트" 를 한 도형으로 묶은 이 앱만의 모양이다.

    ⚠️ **16×16 에서 읽히는 것이 첫 번째 조건이다.** 가는 선을 여러 개 두지 않고
    굵은 면 2개(캔들)와 두꺼운 링 하나로만 만든다. 심지·격자·눈금은 넣지 않는다.
    ⚠️ 캔들을 3개 두면 16px 에서 사이 간격이 사라져 **덩어리 하나로 뭉갠다**(실제로 그랬다).
    2개 + 넓은 간격이라야 "오르는 두 칸" 으로 읽힌다.
    ⚠️ 브라우저 탭은 밝을 수도 어두울 수도 있어 둥근 사각형 배경을 깐다.
    색은 src/index.css @theme 토큰: bg-secondary #1e1e1e / accent #3182f6 / bullish #26a69a
  -->
  <rect width="32" height="32" rx="6" fill="#1e1e1e"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#3182f6" stroke-width="2.5"/>
  <g fill="#26a69a">
    <rect x="10" y="16.5" width="5" height="7" rx="1.4"/>
    <rect x="17.5" y="9.5" width="5" height="14" rx="1.4"/>
  </g>
</svg>
